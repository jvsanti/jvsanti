<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="100%" stop-color="#0a0c1e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1a1d3d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#grid)" opacity="0.55"/>

  <rect x="0" y="0" width="900" height="4" fill="url(#edge)"/>
  <rect x="0" y="216" width="900" height="4" fill="url(#edge)"/>

  <circle cx="820" cy="45" r="70" fill="#ff2bd6" opacity="0.08"/>
  <circle cx="90" cy="180" r="90" fill="#00e5ff" opacity="0.07"/>

  <text x="60" y="75" font-family="'Courier New', monospace" font-size="13" letter-spacing="4" fill="#ff2bd6" filter="url(#glowPink)">QA_ENGINEER // CERTIFIED</text>

  <text x="60" y="130" font-family="'Arial Black', Arial, sans-serif" font-size="46" font-weight="900" fill="#eafcff" filter="url(#glowCyan)">JOAO VICTOR SANTIAGO</text>

  <text x="60" y="165" font-family="'Courier New', monospace" font-size="15" fill="#9fb3d9">Quality Analyst III @ Stellantis  ·  6+ years root cause &amp; process rigor</text>

  <g font-family="'Courier New', monospace" font-size="12" fill="#00e5ff">
    <rect x="60" y="180" width="130" height="24" rx="3" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <text x="72" y="196">STLC: 30/30 EXEC</text>

    <rect x="200" y="180" width="120" height="24" rx="3" fill="none" stroke="#ff2bd6" stroke-width="1"/>
    <text x="212" y="196" fill="#ff7ce8">BUGS: 39 FOUND</text>

    <rect x="330" y="180" width="110" height="24" rx="3" fill="none" stroke="#39ff88" stroke-width="1"/>
    <text x="342" y="196" fill="#8effb8">SITES: 13</text>
  </g>
</svg>
